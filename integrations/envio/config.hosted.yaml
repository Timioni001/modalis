# Generated by scripts/envio-config.sh from config.yaml. Do not edit by hand.
# MODALIS — Envio HyperIndex
#
# Indexes the portfolio's on-chain history so the app never reconstructs it from RPC.
# Schema validated against the `envio` package's own evm.schema.json.
#
# ABIs in ./abis are generated from the COMPILED contracts by
# `pnpm --filter @modalis/chain sync-abis`, so the indexer and the app always agree with what is
# deployed. Do not hand-edit them.
name: modalis
description: Goal-based wealth management on Monad — portfolio, mandate and risk history.
ecosystem: evm
schema: ./schema.graphql
handlers: ./src/handlers

# Addresses come from the environment so one config serves testnet and mainnet.
# Set these from the deploy script's output (contracts/deployments/<chainId>.json).
contracts:
  - name: PortfolioMandate
    abi_file_path: ./abis/PortfolioMandate.json
    events:
      - event: MandateUpdated
      - event: AllocationSet
      - event: MandateActiveSet
      - event: ManagerSet
  - name: PortfolioVault
    abi_file_path: ./abis/PortfolioVault.json
    events:
      - event: Deposited
      - event: Withdrawn
      - event: TradeSettled
      - event: EmergencyWithdrawn
  - name: RebalanceExecutor
    abi_file_path: ./abis/RebalanceExecutor.json
    events:
      - event: Rebalanced
      - event: AllocationSnapshot
  - name: RiskSignalReceiver
    abi_file_path: ./abis/RiskSignalReceiver.json
    events:
      - event: RiskStateUpdated
      - event: RebalanceRequired

chains:
  - id: 10143 # Monad testnet
    start_block: 69626174
    rpc:
      - url: https://testnet-rpc.monad.xyz
    contracts:
      - name: PortfolioMandate
        address: "0x3bbeB5f85C3118847521FA23e48b929aaB1D6A19"
      - name: PortfolioVault
        address: "0xBd4B137d04518512cdA77c223B4C4BFB56811883"
      - name: RebalanceExecutor
        address: "0x30122e85856FD1531bfC904e77Df9b6a91918D18"

# A rebalance that gets reorged away must not stay in the portfolio's history.
rollback_on_reorg: true
field_selection:
  transaction_fields:
    - hash
    - from
