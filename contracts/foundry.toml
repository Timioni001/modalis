[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Cancun, deliberately. Monad is EVM-equivalent at Cancun or later; Cancun bytecode runs on a
# Prague chain, while Prague bytecode would not run on a Cancun one, so this is the safe
# direction. solc 0.8.28 also tops out at Cancun. Re-check https://docs.monad.xyz before a
# mainnet deploy and bump both values together if Monad requires Prague.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
runs = 1024

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"
